[project]
name            = "protein-studio"
version         = "0.3.0"
description     = "A Blender-like molecular viewer with embedded Python scripting, MCP control and free-energy perturbation."
readme          = "README.md"
requires-python = ">=3.10"
authors         = [{ name = "Zhengwei Xie", email = "xiezhengwei@hsc.pku.edu.cn" }]
maintainers     = [{ name = "Zhengwei Xie", email = "xiezhengwei@hsc.pku.edu.cn" }]
license         = { text = "Academic Research Use License 1.0 (non-commercial; see LICENSE)" }
keywords        = [
    "molecular visualization",
    "protein structure",
    "PDB",
    "PySide6",
    "PyVista",
    "Blender-like",
    "free energy perturbation",
    "MCP",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Core runtime dependencies.
# NOTE: `biotite` was listed here before but is never imported — it was a
# phantom dependency. `scikit-image` is required by core/marching_cubes.py
# (no fallback implementation) and was missing.
dependencies = [
    "PySide6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "vtk>=9.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
]

[project.optional-dependencies]
# MD trajectories (core/trajectory.py) — imported lazily, raises a clear
# ImportError when absent.
trajectory = ["MDAnalysis>=2.6"]
# MCP server for agent-driven control (mcp_server.py / mcp_qt_server.py).
mcp = ["mcp>=1.0", "uvicorn>=0.30"]
# Free-energy perturbation sweeps (core/fep.py, core/fep_mcp.py).
fep = ["openmm>=8.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
all = [
    "MDAnalysis>=2.6",
    "mcp>=1.0",
    "uvicorn>=0.30",
    "openmm>=8.0",
]

[project.scripts]
protein-studio = "protein_studio.app:main"

[project.urls]
Homepage      = "https://github.com/kekegg/protein-studio"
Repository    = "https://github.com/kekegg/protein-studio"
Issues        = "https://github.com/kekegg/protein-studio/issues"
Documentation = "https://github.com/kekegg/protein-studio#readme"
Source        = "https://github.com/kekegg/protein-studio"

[build-system]
requires      = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
license-files = ["LICENSE", "LICENSE.zh-CN.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
